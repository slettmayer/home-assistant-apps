name: Auto Release

# Runs only after the "Build Add-on" workflow finishes, so the GitHub release
# is never created before the add-on images are actually built and published.
on:
  workflow_run:
    workflows: ["Build Add-on"]
    types: [completed]
    branches: [main]

jobs:
  release:
    # Only for a successful push build (not PRs, not failed/cancelled builds).
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          version=$(grep '^version:' mcp-proxy/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          # Extract the section for this version from CHANGELOG.md
          # Matches from "## X.Y.Z" to the next "## " or end of file
          notes=$(awk -v ver="${VERSION}" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' mcp-proxy/CHANGELOG.md | sed -e '/^$/N;/^\n$/d' -e 's/^[[:space:]]*//')
          # Write to file to preserve newlines
          echo "${notes}" > /tmp/release-notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${TAG}" \
            --target "${SHA}" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
